# nginx do container "web" (docker-compose.yml).
server {
    listen 80;
    root /usr/share/nginx/html;

    # As chamadas /api vão para o container da API. O navegador fala com uma origem só (sem CORS),
    # como o proxy do Vite faz no "npm run dev".
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Fotos de quiosque enviadas pelo admin: até 5 MB (o padrão do nginx é 1 MB).
        client_max_body_size 6m;
    }

    # Fotos enviadas pelo admin, servidas pela API.
    location /uploads/ {
        proxy_pass http://api:8080;
    }

    # SPA: qualquer rota que não seja um arquivo (ex.: /consultar, /minhas-reservas) devolve o index.html,
    # e o React Router mostra a tela certa. Assim o F5 funciona em qualquer tela.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
